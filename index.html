<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PALAK_OS</title>
<style>
  /* ============================================================
     EDIT ZONE #1 — quick personalization
     Change these to your names / theme colors. Search this file
     for "EDIT ZONE" to find every place you can customize.
     ============================================================ */
  :root{
    --bg:        #0a0d12;
    --bg-2:      #10151d;
    --panel:     #12181f;
    --line:      #263041;
    --text:      #d7e0ea;
    --dim:       #6b7a8d;
    --rose:      #ff5d7a;
    --rose-dim:  #7a2f3d;
    --cyan:      #5eead4;
    --amber:     #f5c56b;
    --mono: 'IBM Plex Mono', 'Consolas', monospace;
    --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden; user-select:none;
    height:100vh; width:100vw; position:relative;
  }

  /* scanline / CRT atmosphere */
  #crt{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:9998;
    box-shadow: inset 0 0 180px rgba(0,0,0,0.75);
  }

  /* ---------------- BOOT SCREEN ---------------- */
  #boot{
    position:fixed; inset:0; background:#000; color:var(--cyan);
    font-family:var(--mono); font-size:15px; line-height:1.7;
    padding:8vh 6vw; z-index:100; white-space:pre-wrap;
  }
  #boot .cursor{display:inline-block; width:8px; height:14px; background:var(--cyan); vertical-align:-2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  #boot-press{
    margin-top:28px; color:var(--rose); opacity:0; font-size:13px;
    letter-spacing:.12em;
  }
  #boot-press.show{opacity:1; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4;} 50%{opacity:1;}}

  /* ---------------- DESKTOP ---------------- */
  #desktop{
    position:fixed; inset:0; opacity:0; pointer-events:none; transition:opacity 1.1s ease;
    background:var(--bg); overflow:hidden;
  }
  #desktop.on{opacity:1; pointer-events:auto;}
  #desktop::before{
    content:''; position:absolute; inset:-30px;
    background-image: var(--bg-photo, none);
    background-size:cover; background-position:center 25%;
    filter: blur(22px) brightness(0.4) saturate(1.2);
    transform:scale(1.08);
    z-index:0;
  }
  #desktop::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,93,122,0.28), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(255,178,120,0.14), transparent 50%),
      linear-gradient(180deg, rgba(8,10,14,.5), rgba(8,10,14,.82));
  }
  .heart-drift{
    position:absolute; bottom:-40px; z-index:1; color:var(--rose); opacity:0;
    font-size:16px; pointer-events:none; animation:heartFloat linear infinite;
  }
  @keyframes heartFloat{
    0%{ transform:translateY(0) translateX(0) scale(.8); opacity:0; }
    10%{ opacity:.55; }
    90%{ opacity:.35; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)) scale(1); opacity:0; }
  }

  #topbar{
    position:relative; z-index:2;
    height:34px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--line); background:var(--bg-2);
    font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.04em;
  }
  #topbar .brand{color:var(--rose); font-weight:600;}
  #topbar .right{display:flex; gap:18px; align-items:center;}
  #love-meter{display:flex; align-items:center; gap:6px;}
  #love-bar{width:70px; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  #love-bar i{display:block; height:100%; width:99%; background:linear-gradient(90deg,var(--rose),var(--amber));}

  #icons{
    position:absolute; top:60px; left:24px; right:24px; bottom:70px; z-index:2;
    display:grid; grid-template-columns:repeat(auto-fill, 96px); gap:22px 10px;
    align-content:start;
  }
  .icon{
    width:96px; text-align:center; cursor:pointer; padding:10px 4px; border-radius:10px;
    transition:background .15s ease;
  }
  .icon:hover{background:rgba(255,255,255,0.04);}
  .icon .glyph{
    width:52px; height:52px; margin:0 auto 8px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:var(--panel); border:1px solid var(--line);
  }
  .icon.locked .glyph{opacity:.4; filter:grayscale(1);}
  .icon .label{font-family:var(--mono); font-size:11px; color:var(--text); letter-spacing:.02em;}
  .icon .sub{font-family:var(--mono); font-size:9px; color:var(--dim); margin-top:2px;}

  #taskbar{
    position:absolute; left:0; right:0; bottom:0; height:52px; z-index:2;
    background:var(--bg-2); border-top:1px solid var(--line);
    display:flex; align-items:center; padding:0 16px; gap:10px;
    font-family:var(--mono); font-size:11px; color:var(--dim);
  }
  #clock{margin-left:auto; color:var(--text);}
  .task-chip{
    padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
    color:var(--text); cursor:pointer;
  }

  /* ---------------- WINDOWS ---------------- */
  .win{
    position:absolute; width:420px; min-height:280px; max-height:calc(100vh - 100px);
    background:var(--panel);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.55);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .win-head{
    height:38px; background:var(--bg-2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; padding:0 0 0 14px; cursor:grab; gap:8px;
    font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.03em;
  }
  .win-head:active{cursor:grabbing;}
  .win-close{
    margin-left:auto; width:38px; height:38px; border-radius:0; border:none; border-left:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--dim); font-size:13px;
  }
  .win-close:hover{color:#fff; background:var(--rose);}
  .win-body{padding:20px 20px 34px; overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; font-size:13.5px; line-height:1.55;}
  .win-body > *:last-child{margin-bottom:0 !important;}
  .win-body h3{margin:0 0 12px; font-family:var(--mono); color:var(--rose); font-size:14px; letter-spacing:.03em;}

  .btn{
    background:var(--rose); color:#1a0a0d; border:none; padding:9px 16px; border-radius:7px;
    font-family:var(--mono); font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.03em;
  }
  .btn:hover{background:#ff7690;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  input.field{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:7px; font-family:var(--mono); font-size:13px; margin-bottom:10px;
  }

  /* memories */
  .mem-card{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background:var(--bg);}
  .mem-date{font-family:var(--mono); color:var(--cyan); font-size:11px; margin-bottom:4px;}
  .mem-ph{
    height:100px; border-radius:8px; margin:8px 0; display:flex; align-items:center; justify-content:center;
    font-size:26px; background:linear-gradient(135deg, rgba(255,93,122,.18), rgba(94,234,212,.1));
    border:1px dashed var(--line); color:var(--dim); font-family:var(--mono); font-size:11px;
  }
  .mem-photo{
    width:100%; max-height:260px; object-fit:cover; border-radius:8px; margin:8px 0;
    border:1px solid var(--line); display:block;
  }

  /* timeline */
  .tl{position:relative; padding-left:22px;}
  .tl-item{position:relative; margin-bottom:18px;}
  .tl-item::before{content:''; position:absolute; left:-22px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--rose); z-index:1;}
  .tl-item:not(:last-child)::after{content:''; position:absolute; left:-18px; top:14px; bottom:-18px; width:2px; background:var(--line);}
  .tl-item:last-child{margin-bottom:0;}
  .tl-date{font-family:var(--mono); font-size:11px; color:var(--cyan);}
  .tl-title{font-weight:600; margin:2px 0;}
  .tl-desc{color:var(--dim); font-size:12.5px;}

  /* love calc */
  #lc-result{text-align:center; margin-top:14px;}
  #lc-num{font-family:var(--mono); font-size:40px; color:var(--rose); font-weight:700;}
  #lc-bar-wrap{height:10px; background:var(--bg); border:1px solid var(--line); border-radius:5px; overflow:hidden; margin-top:14px;}
  #lc-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--rose));}
  .lc-log{font-family:var(--mono); font-size:11.5px; color:var(--dim); margin-top:12px; line-height:1.8;}
  .lc-log div{opacity:0;}

  /* locked apps */
  .lockmsg{font-family:var(--mono); font-size:12px; color:var(--amber); border:1px dashed var(--amber); padding:10px 12px; border-radius:8px; margin-bottom:14px;}
  .hint{font-family:var(--mono); font-size:11px; color:var(--dim); margin:-4px 0 12px; font-style:italic;}
  .progress-row{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--dim); margin-bottom:6px;}
  .progress-row .chk{width:14px; height:14px; border-radius:4px; border:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px;}
  .progress-row.done .chk{background:var(--cyan); color:#04201c; border-color:var(--cyan);}
  .progress-row.done{color:var(--text);}

  #secret-final{display:none; text-align:center;}
  #secret-final.show{display:block;}
  #secret-final .msg{
    font-size:15px; line-height:1.7; margin-top:14px; color:var(--text);
    /* EDIT ZONE #2 target — see the JS SECRET_MESSAGE variable */
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>

<div id="crt"></div>
<div id="vignette"></div>

<!-- ===================== BOOT SCREEN ===================== -->
<div id="boot">
  <div id="boot-lines"></div>

</div>

      <div class="label">love_calc.exe</div>
      <div class="sub">unlocked</div>
    </div>
    <div class="icon" data-app="future">
      <div class="glyph">🔮</div>
      <div class="label">future.exe</div>
      <div class="sub">locked</div>
    </div>
    <div class="icon locked" data-app="secret">
      <div class="glyph">🔐</div>
      <div class="label">secret.exe</div>
      <div class="sub">restricted</div>

  </div>

  <div id="taskbar">
    <div class="task-chip" style="cursor:default;">☰ START</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

// ---- boot sequence ----
const bootLinesEl = document.getElementById('boot-lines');
const bootPress = document.getElementById('boot-press');
let bi = 0;
function typeBootLine(){
  if(bi >= BOOT_LINES.length){
    bootPress.classList.add('show');
    document.addEventListener('keydown', startDesktopOnce);
    document.getElementById('boot').addEventListener('click', startDesktopOnce);
    return;
  }
  const line = BOOT_LINES[bi];
  const div = document.createElement('div');
  bootLinesEl.appendChild(div);
  let ci = 0;
  const speed = line.length === 0 ? 0 : 12;
  function typeChar(){
    div.textContent = line.slice(0, ci);
    ci++;
    if(ci <= line.length){ setTimeout(typeChar, speed); }
    else { bi++; setTimeout(typeBootLine, 90); }
  }
  typeChar();
}
let started = false;
function startDesktopOnce(){
  if(started) return; started = true;
  document.getElementById('boot').style.transition = 'opacity .6s ease';
  document.getElementById('boot').style.opacity = '0';
  setTimeout(()=>{
    document.getElementById('boot').style.display='none';
    document.getElementById('desktop').classList.add('on');
  }, 600);
}
typeBootLine();

function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
tick(); setInterval(tick, 1000);

// ---- progress state (session only — no localStorage in this environment) ----
const progress = { memories:false, us:false, calc:false, future:false };
function progressCount(){ return Object.values(progress).filter(Boolean).length; }
function markVisited(app){
  if(app in progress){ progress[app] = true; }
  refreshIcons();
}
function refreshIcons(){
  document.querySelector('[data-app="secret"]').classList.toggle('locked', progressCount() < 4);
  document.querySelector('[data-app="secret"] .sub').textContent = progressCount() < 4 ? 'restricted' : 'unlocked';
}

// ---- window manager ----
let zTop = 10;
let winCount = 0;
function openWindow({title, bodyHTML, width=420, onOpen}){
  const win = document.createElement('div');
  win.className = 'win';
  win.style.zIndex = ++zTop;
  win.style.width = width+'px';
  winCount++;
  const offset = (winCount % 6) * 22;
  win.style.left = (Math.max(20, (window.innerWidth-width)/2) + offset - 60) + 'px';

  const BOTTOM_CLEARANCE = 88; // taskbar (52px) + breathing room above it
  const MIN_WIN_HEIGHT = 240;
  let top = 90 + offset;
  let available = window.innerHeight - top - BOTTOM_CLEARANCE;
  if(available < MIN_WIN_HEIGHT){
    top = Math.max(46, window.innerHeight - BOTTOM_CLEARANCE - MIN_WIN_HEIGHT);
    available = window.innerHeight - top - BOTTOM_CLEARANCE;
  }
  win.style.top = top + 'px';
  win.style.maxHeight = available + 'px';
  win.innerHTML = `
    <div class="win-head">
      <span>${title}</span>
      <div class="win-close">✕</div>
    </div>
    <div class="win-body">${bodyHTML}</div>
  `;
  document.getElementById('desktop').appendChild(win);
  win.querySelector('.win-close').onclick = () => win.remove();
  win.addEventListener('mousedown', () => { win.style.zIndex = ++zTop; });

  // dragging
  const head = win.querySelector('.win-head');
  let dragging = false, sx=0, sy=0, ox=0, oy=0;
  head.addEventListener('mousedown', (e) => {
    if(e.target.classList.contains('win-close')) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
  });
  window.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    win.style.left = (ox + e.clientX - sx) + 'px';
    win.style.top = Math.max(38, oy + e.clientY - sy) + 'px';
  });
  window.addEventListener('mouseup', () => dragging=false);
  // touch support
  head.addEventListener('touchstart', (e) => {
    if(e.target.classList.contains('win-close')) return;
    const t = e.touches[0];
    dragging = true; sx = t.clientX; sy = t.clientY; ox = win.offsetLeft; oy = win.offsetTop;
  });
  window.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    const t = e.touches[0];
    win.style.left = (ox + t.clientX - sx) + 'px';
    win.style.top = Math.max(38, oy + t.clientY - sy) + 'px';
  });
  window.addEventListener('touchend', () => dragging=false);

  if(onOpen) onOpen(win);
  return win;
}

  if(progressCount() < 4){
    const rows = [
      ['memories','memories.exe'], ['us','us.exe'], ['calc','love_calculator.exe'], ['future','future.exe']
    ].map(([k,label]) => `
      <div class="progress-row ${progress[k] ? 'done':''}">
        <div class="chk">${progress[k] ? '✓' : ''}</div> ${label}
      </div>
    `).join('');
    openWindow({ title:'secret.exe — LOCKED', bodyHTML: `
      <h3>🔐 CLASSIFIED FILE</h3>
      <div class="lockmsg">Open the other applications first to unlock this file.</div>
      ${rows}
    `});
    return;
  }
  const body = `
    <h3>🔐 SECRET.EXE</h3>
    <div class="lockmsg">All systems verified. Final authentication required.</div>
    <input class="field" id="sp" type="password" placeholder="Enter password">
    ${SECRET_HINT ? `<div class="hint">${SECRET_HINT}</div>` : ''}
    <button class="btn" id="sbtn">Unlock</button>
    <div id="serr" style="color:var(--rose); font-size:12px; margin:8px 0;"></div>
    <div id="secret-final">
      <img src="${PHOTOS.download}" alt="" style="width:100%; border-radius:10px; border:1px solid var(--line); margin-top:6px;">
      <div class="msg" style="white-space:pre-wrap;">${SECRET_MESSAGE}</div>
    </div>
  `;
  openWindow({ title:'secret.exe', width:460, bodyHTML: body, onOpen:(win)=>{
    win.querySelector('#sbtn').onclick = () => {
      const val = win.querySelector('#sp').value;
      if(val === SECRET_PASSWORD){
        win.querySelector('#sbtn').style.display='none';
        win.querySelector('#sp').style.display='none';
        win.querySelector('#secret-final').classList.add('show');
      } else {
        win.querySelector('#serr').textContent = 'ACCESS DENIED — try again.';
      }
    };
  }});
}

// ---- icon click routing ----
document.querySelectorAll('.icon').forEach(icon => {
  icon.addEventListener('click', () => {
    const app = icon.dataset.app;
    if(app === 'memories') openMemories();
    if(app === 'us') openUs();
    if(app === 'calc') openCalc();
    if(app === 'future') openFuture();
    if(app === 'secret') openSecret();
  });
});
refreshIcons();

// ---- romantic desktop background ----
document.getElementById('desktop').style.setProperty('--bg-photo', `url(${PHOTOS.second_meet})`);

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart-drift';
  h.textContent = Math.random() > 0.5 ? '❤' : '♥';
  const left = Math.random()*100;
  const duration = 14 + Math.random()*10;
  const size = 12 + Math.random()*14;
  const drift = (Math.random()*60 - 30) + 'px';
  h.style.left = left+'%';
  h.style.fontSize = size+'px';
  h.style.setProperty('--drift', drift);
  h.style.animationDuration = duration+'s';
  document.getElementById('desktop').appendChild(h);
  setTimeout(()=> h.remove(), duration*1000 + 500);
}
for(let i=0;i<5;i++){ setTimeout(spawnHeart, i*1400); }
setInterval(spawnHeart, 2600);
</script>
</body>
</html>
